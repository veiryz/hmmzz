<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title> Surat untuk kamu💕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #2b0a3d, #6a0f49, #2b0a3d);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    position: relative;
  }

  /* Hati besar yang berdetak di tengah */
  .center-heart {
    width: 100px;
    height: 100px;
    position: relative;
    animation: beat 1.1s infinite ease-in-out;
    z-index: 5;
  }

  .center-heart::before,
  .center-heart::after {
    content: "";
    position: absolute;
    top: 0;
    width: 55px;
    height: 90px;
    background: #ff3b6b;
    border-radius: 50px 50px 0 0;
    box-shadow: 0 0 25px #ff6b9a, 0 0 60px #ff3b6b88;
  }

  .center-heart::before {
    left: 50px;
    transform: rotate(-45deg);
    transform-origin: 0 100%;
  }

  .center-heart::after {
    left: 0;
    transform: rotate(45deg);
    transform-origin: 100% 100%;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    40% { transform: scale(0.95); }
  }

  .caption {
    position: absolute;
    bottom: 8%;
    color: #ffd6e6;
    text-align: center;
    font-size: 1.1rem;
    letter-spacing: 1px;
    text-shadow: 0 0 10px #ff6b9a;
    animation: fadeGlow 2s infinite alternate;
  }

  @keyframes fadeGlow {
    from { opacity: 0.6; }
    to { opacity: 1; }
  }

  /* Hati kecil yang terbang naik terus-menerus */
  .heart {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    color: #ff6b9a;
    opacity: 0.9;
    animation-name: float-up;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
    user-select: none;
    pointer-events: none;
  }

  @keyframes float-up {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg) scale(0.8);
      opacity: 0;
    }
    10% { opacity: 1; }
    50% {
      transform: translateY(-50vh) translateX(20px) rotate(15deg) scale(1.1);
    }
    100% {
      transform: translateY(-105vh) translateX(-20px) rotate(-10deg) scale(0.6);
      opacity: 0;
    }
  }

  .center-heart {
    cursor: pointer;
  }

  .hint {
    position: absolute;
    top: calc(50% + 90px);
    color: #ffd6e6;
    font-size: 0.85rem;
    opacity: 0.7;
    animation: pulse-hint 1.6s infinite;
    z-index: 5;
    pointer-events: none;
  }

  @keyframes pulse-hint {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  /* Overlay surat */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 5, 20, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease;
    z-index: 20;
  }

  .overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .letter {
    background: #fff8f2;
    background-image: linear-gradient(#fbe3ea 1px, transparent 1px);
    background-size: 100% 2em;
    color: #5a2436;
    max-width: 480px;
    width: 88%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 2.2rem 2rem;
    border-radius: 8px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.5), 0 0 0 6px #ffe3ec;
    font-family: 'Georgia', serif;
    line-height: 2em;
    position: relative;
    transform: scale(0.7) translateY(40px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .overlay.show .letter {
    transform: scale(1) translateY(0);
  }

  .letter h2 {
    text-align: center;
    color: #d63d68;
    margin-bottom: 0.6rem;
    font-size: 1.4rem;
  }

  .letter p {
    font-size: 1.05rem;
    margin-bottom: 0.4rem;
  }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 1.4rem;
    color: #d63d68;
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
  }

  .signature {
    text-align: right;
    margin-top: 1rem;
    font-style: italic;
    color: #d63d68;
  }
</style>
</head>
<body>

  <div class="center-heart" id="heartBtn"></div>
  <div class="hint">tap hatinya ✨</div>
  <div class="caption">dibuat dengan sepenuh hati 💌</div>

  <div class="overlay" id="overlay">
    <div class="letter">
      <button class="close-btn" id="closeBtn">✕</button>
      <h2>Untuk Kamu 💌</h2>
      <p>Hai bee,</p>
      <p>
       Semangat ya kuliahnya, 
       Jangan malas malasan,
       semoga kita dapat sarjananya bareng bareng ya
      </p>
      <p>
        Setiap detik bersamamu selalu terasa spesial,
        dan aku bersyukur bisa kenal kamu.
      </p>
      <p class="signature">— dari ilham, untuk rishel 💖</p>
    </div>
  </div>

  <script>
    const overlay = document.getElementById("overlay");
    document.getElementById("heartBtn").addEventListener("click", () => {
      overlay.classList.add("show");
    });
    document.getElementById("closeBtn").addEventListener("click", () => {
      overlay.classList.remove("show");
    });
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) overlay.classList.remove("show");
    });
  </script>

  <script>
    const symbols = ["❤️", "💕", "💖", "💗", "💓", "💘"];
    const body = document.body;

    function spawnHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];

      const size = 16 + Math.random() * 26;
      const left = Math.random() * 100;
      const duration = 4 + Math.random() * 4;

      heart.style.left = left + "vw";
      heart.style.fontSize = size + "px";
      heart.style.animationDuration = duration + "s";

      body.appendChild(heart);

      setTimeout(() => heart.remove(), duration * 1000);
    }

    // Spawn hati baru berulang-ulang
    setInterval(spawnHeart, 300);

    // Beberapa hati langsung muncul di awal
    for (let i = 0; i < 10; i++) {
      setTimeout(spawnHeart, i * 150);
    }
  </script>

</body>
</html>
